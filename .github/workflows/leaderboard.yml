name: ⭐ Leaderboard

on:
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    name: ⭐ Update the README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked] this job pushes the README
        with:
          ssh-key: ${{ secrets.LEADERBOARD_DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Fill in the top 100s
        run: node .github/scripts/leaderboard.ts
      - name: Push it to main
        env:
          BOT: ${{ secrets.LEADERBOARD_DEPLOY_KEY != '' }}
        run: |
          if git diff --quiet; then
            echo "Nothing's moved since the last update" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$BOT" = true ]; then
            git config user.name "git-star-ranking[bot]"
            git config user.email "352375097+git-star-ranking[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git commit -qam "docs: update the leaderboard"
          git pull -q --rebase
          git push
          echo "✅ Leaderboard updated" >> "$GITHUB_STEP_SUMMARY"
