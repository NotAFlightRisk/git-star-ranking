name: 📦 Release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: 📦 Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"
